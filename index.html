<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Page</title>
    <style>
        /* CSS styles go here */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .animated-box {
            width: 100px;
            height: 100px;
            background-color: red;
            position: relative; /* Required for the animation to work correctly with 'left' and 'top' properties */
            animation-name: colorAndMove;
            animation-duration: 4s; /* Duration of one animation cycle */
            animation-iteration-count: infinite; /* Loops the animation forever */
            animation-direction: alternate; /* Reverses the animation on each cycle */
            border-radius: 10px;
        }

        /* Define the animation keyframes */
        @keyframes colorAndMove {
            0% {
                background-color: red;
                left: 0px;
                top: 0px;
            }
            25% {
                background-color: yellow;
                left: 200px;
                top: 0px;
            }
            50% {
                background-color: blue;
                left: 200px;
                top: 200px;
            }
            75% {
                background-color: green;
                left: 0px;
                top: 200px;
            }
            100% {
                background-color: red;
                left: 0px;
                top: 0px;
            }
        }
    </style>
</head>
<body>

    <!-- HTML content goes here -->
    <div class="animated-box"></div>

</body>
</html>
